seed: 42

dataset:
  repo_id: lerobot/pusht
  revision: v1.3
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1

model:
  input_dim: 2
  hidden_dims: [128, 128]
  output_dim: 2

training:
  epochs: 80
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.000001
  num_workers: 0
  device: auto

output:
  checkpoint: checkpoints/bc_state.pt
  history: results/bc_history.json
